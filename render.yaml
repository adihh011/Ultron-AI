services:
  - type: web
    name: ultron-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: FISH_AUDIO_API_KEY
        sync: false
      - key: FISH_AUDIO_VOICE_ID
        sync: false
      - key: FISH_AUDIO_MODEL
        value: s2.1-pro-free
      - key: ULTRON_API_TOKEN
        sync: false
